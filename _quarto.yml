project:
  type: website

website:
  title: "Chris Hires"
  navbar:
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: posts.qmd
        text: Posts
  google-analytics: "G-LJ3R753XPB"

format:
  html:
    anchor-sections: false
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/vsalvino/computer-modern@main/fonts/serif.css">
    include-after-body:
      # Footnote hovers copy the footnote's HTML once at page load. With
      # MathJax 4 (Quarto 1.10+) typesetting finishes later, so hovers
      # showed raw \(...\). Refresh each hover once MathJax is done.
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", () => {
            const ready = window.MathJax?.startup?.promise;
            if (!ready) return;
            ready.then(() => {
              document.querySelectorAll('a[role="doc-noteref"]').forEach((ref) => {
                const id = (ref.getAttribute("data-footnote-href") || ref.getAttribute("href") || "").replace(/^.*#\/?/, "");
                const note = document.getElementById(id);
                if (ref._tippy && note) ref._tippy.setContent(note.innerHTML);
              });
            });
          });
          </script>
    toc: true
    code-fold: true
    code-summary: "Show Code"
    css: styles.css
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true

